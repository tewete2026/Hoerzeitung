{% extends "base_s_form.html" %}
{% block content %}
<div class="container">
  <main>
    <div class="py-3 text-center">
      <img class="d-block mx-auto mb-4" src="{{ url_for('static', filename='Logo_Title_black_200.png') }}" alt="Logo_Title_black_200">
      <h2>Hochladen Kapitel-Beitrag zum Album <em class="small">{{ conf.get('title') }}</em></h2>
    </div>
    <div class="row g-4">
      <form class="needs-validation" id="frm-main-upload-chapter" novalidate autocomplete="off" method="post" enctype="multipart/form-data">
        <div class="row g-3">
          <fieldset id="frm-main-set-base" name="frm-main-set-base">
            <div class="ms-2 pb-1" style="width: 98%;">
              <label for="frm-main-file">Audio-Datei zum Hochladen auswählen</label>
              <input class="form-control" type="file" accept="audio/*" name="frm-main-file" id="frm-main-file" aria-label="Datei wählen" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-sm-4 mt-2 pb-1" style="padding-right: calc(var(--bs-gutter-x) * .5);padding-left: calc(var(--bs-gutter-x) * .5);">
              <label for="frm-main-datum">Produktions Datum</label>
              <input type="datetime-local" class="form-control" name="frm-main-datum" id="frm-main-datum" value="{{ conf.get('datetimenow') }}" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="ms-2 mt-2 pb-1" style="width: 98%;">
              <label for="frm-main-title">Titel</label>
              <input type="text" class="form-control" name="frm-main-title" id="frm-main-title" placeholder="...oder Titel der Quelle" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="ms-2 mt-2 pb-1" style="width: 98%;">
              <label for="frm-main-author">Autor</label>
              <input type="text" class="form-control" name="frm-main-author" id="frm-main-author" placeholder="...oder Autor der Quelle" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="ms-2 mt-2 pb-1" style="width: 98%;">
              <label for="frm-main-summary">Beschreibung</label>
              <textarea class="form-control" name="frm-main-summary" id="frm-main-summary" rows="3" placeholder="(Optional) Kurze Beschreibung des Inhalts des Beitrags"></textarea>
              <div class="invalid-feedback"></div>
            </div>
            <div class="ms-2 mt-2 pb-1" style="width: 98%;">
              <label for="frm-main-license">Urheber/Herausgeber/Quelle</label>
              <select class="form-select" id="frm-main-license" name="frm-main-license" required>
                <option value="-1">Bitte wählen...</option>{% for text in conf.get('herausgeber') %}
                <option value="{{ text }}">{{ text }}</option>{% endfor %}
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div style="display:flex;">
              <div class="col-sm-4 mt-2 pb-1" style="padding-right: calc(var(--bs-gutter-x) * .5);padding-left: calc(var(--bs-gutter-x) * .5);">
                <label for="frm-main-source-date">Veröffentlichungs Datum der Quelle</label>
                <input type="date" class="form-control" name="frm-main-source-date" id="frm-main-source-date" value="{{ conf.get('datenow') }}" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-sm-4 ms-2 mt-2 pb-1">
                <label for="frm-main-allowed">Lizenz</label>
                <select class="form-select" id="frm-main-allowed" name="frm-main-allowed" required>
                  <option value="-1">Bitte wählen...</option>{% for text in conf.get('lizenz') %}
                  <option value="{{ text[1] }}">{{ text[0] }}</option>{% endfor %}
                </select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="ms-2 mt-2 pb-1" style="width: 98%;">
              <label for="frm-main-reader">Vorleser/in</label>
              <select class="form-select" id="frm-main-reader" name="frm-main-reader" required>
                <option value="-1">Bitte wählen...</option>{% for text in conf.get('vorleser') %}
                <option value="{{ text }}">{{ text }}</option>{% endfor %}
              </select>
              <div class="invalid-feedback"></div>
            </div>
          </fieldset>
        </div>
        <div class="py-1 text-center">
          <button class="w-50 btn btn-primary btn-lg mt-3 mb-2" id="btn-submit" type="submit">Hochladen Ausführen</button>
        </div>
      </form>
    </div>
  </main>
</div>
{% endblock %}
