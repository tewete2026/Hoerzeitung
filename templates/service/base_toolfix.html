    <div class="col-lg-8 mx-auto p-4 py-md-5">
        <header class="d-flex align-items-center pb-3 mb-2 border-bottom">
            <a href="/" class="d-flex align-items-center text-body-emphasis text-decoration-none">
            <svg class="bi me-2" width="40" height="32"><use xlink:href="#home"/></svg>
            <span class="fs-4">Service/Toolfix</span>
            </a>
        </header>

        <main>
          <div class="row g-5">
            <div class="col-md-6">
                <h2 class="text-body-emphasis">Übersicht aller Rules</h2>
                <ul class="list-unstyled ps-0">{% for rule in rules %}
                <li>
                    <a class="icon-link mb-1" href="{{ rule.rule.replace('<auth_code>', 'Y6ZA-84Q9-A1UZ-TT249').replace('<file>', '1039.mp3') }}" rel="noopener" target="_blank">
                        <svg class="bi" width="16" height="16"><use xlink:href="#arrow-right-circle"/></svg>
                        {{ rule.endpoint }}
                    </a>
                </li>{% endfor %}
                </ul>
            </div>
            <div class="col-md-6">
                <h2 class="text-body-emphasis">Übersicht aller Rules</h2>

                        <svg class="bi" width="16" height="16"><use xlink:href="#arrow-right-circle"/></svg>
                        {{ rule.endpoint }}
                    </a>

                </ul>
            </div>
          </div>
