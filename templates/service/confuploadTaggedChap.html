{% extends "base_s_form.html" %}
{% block content %}
<div class="container">
  <main>
    <div class="py-3 text-center">
      <img class="d-block mx-auto mb-4" src="{{ url_for('static', filename='Logo_Title_black_200.png') }}" alt="Logo_Title_black_200">
      <h2>Erfassen Kapitel nach Vorlage im Album <em class="small">{{ conf.get('title') }}</em></h2>
    </div>
    <div class="row g-4">
      <form class="needs-validation" id="frm-main-upload-taggedchap" novalidate autocomplete="off" method="post" enctype="multipart/form-data">
        <div class="row g-3">
          <div class="table-responsive">
            <table class="table text-center">
              <thead>
                <tr>
                  <th style="width: 5%;">Kap#</th>
                  <th style="width: 85%;">Bezeichnung</th>
                  <th style="width: 5%;">Von</th>
                  <th style="width: 5%;">Bis</th>
                </tr>
              </thead>
              <tbody>{% for row in conf.get('taggedchap') %}
                <tr>
                  <th scope="row" class="text-start">{{ row['key'] }}</th>
                  <td>{{ row['desc'] }}</td>
                  <td>{{ row['start_timefmt'] }}</td>
                  <td>{{ row['end_timefmt'] }}</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
        <div class="py-1 text-center">
          <button class="w-50 btn btn-primary btn-lg mt-3 mb-2" id="btn-submit" type="submit">Starten</button>
        </div>
        <div class="py-1 text-center">
          <input type="hidden" value="off" name="frm-main-upload-cancel">
          <button class="w-25 btn btn-secondary btn-lg mt-3 mb-2" id="btn-cancel" type="submit">Abbrechen</button>
        </div>
      </form>
    </div>
  </main>
</div>
{% endblock %}
